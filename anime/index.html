<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime browser | pastpapergenie</title>
<meta name="description" content="Search anime and stream via MegaPlay.">
<link rel="stylesheet" href="../style.css">
<script src="../script.js"></script>
</head>
<body>
<div id="page">
<header>
<p class="logo"><a href="../#/games">pastpapergenie <small>v3</small></a></p>
<p class="blurb">Browser games and an anime browser.</p>
</header>
<nav>
<a href="../#/games">Games</a>
<a class="start" href="./">Anime</a>
<a href="../#/recommended">Announcements</a>
<a href="../#/saved">Saved</a>
<a href="../#/settings">Settings</a>
<a href="../#/about">About</a>
</nav>
<div id="cols">
<main>
  <!-- Search & Grid Window -->
  <div class="win">
    <h2>Anime Browser</h2>
    <div class="in">
      <form id="abar" class="row">
        <input id="aq" type="search" placeholder="Search a title, e.g. Naruto" aria-label="Search anime" style="flex:1"> 
        <button class="go" type="submit">Search</button>
      </form>
      <div id="alist" class="grid">Loading...</div>
    </div>
  </div>

  <!-- Native Video Player Window (Uses your .stage & .win classes) -->
  <div id="player-win" class="win" hidden>
    <h2 id="player-title">Now Playing</h2>
    <div class="in">
      <div class="stage">
        <iframe id="mp-iframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>
      <div class="row" style="justify-content: flex-end; margin-top: 6px;">
        <button type="button" onclick="closePlayer()">Close Player</button>
      </div>
    </div>
  </div>
</main>
</div>
<footer>
  <p>Streaming powered by MegaPlay. Licence problem or takedown request: contact details coming soon.</p>
</footer>
</div>

<script src="anime.js"></script>
</body>
</html>
