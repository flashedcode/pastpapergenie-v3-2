<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime browser | pastpapergenie</title>
<meta name="description" content="Search anime and stream via MegaPlay.">
<link rel="stylesheet" href="../style.css">
<script src="../script.js"></script>
</head>
<body>
<div id="page">
<header>
<p class="logo"><a href="../#/games">pastpapergenie <small>v3</small></a></p>
<p class="blurb">Browser games and an anime browser.</p>
</header>
<nav>
<a href="../#/games">Games</a>
<a class="start" href="./">Anime</a>
<a href="../#/recommended">Announcements</a>
<a href="../#/saved">Saved</a>
<a href="../#/settings">Settings</a>
<a href="../#/about">About</a>
</nav>
<div id="cols">
<main>
  <!-- Search & Grid Window -->
  <div id="browser-win" class="win">
    <h2>Anime Browser</h2>
    <div class="in">
      <form id="abar" class="row" onsubmit="handleSearch(event)">
        <input id="aq" type="search" placeholder="Search a title, e.g. Naruto" aria-label="Search anime" style="flex:1"> 
        <button class="go" type="submit">Search</button>
      </form>
      <div id="alist" class="grid">Loading recommended anime...</div>
    </div>
  </div>

  <!-- Native Video Player Window (Uses your .stage & .win classes) -->
  <div id="player-win" class="win" hidden>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
      <h2 id="player-title" style="margin: 0;">Now Playing</h2>
      <button type="button" onclick="closePlayer()">&larr; Back to List</button>
    </div>
    
    <div class="in">
      <!-- MegaPlay Server Selector (Sub / Dub) -->
      <div style="display: flex; gap: 6px; margin-bottom: 10px; align-items: center;">
        <strong style="font-size: 11px;">SERVER:</strong>
        <button type="button" id="btn-sub" class="provider-btn active" onclick="setSource('sub', this)">MegaPlay (Sub)</button>
        <button type="button" id="btn-dub" class="provider-btn" onclick="setSource('dub', this)">MegaPlay (Dub)</button>
      </div>

      <div class="stage">
        <iframe id="mp-iframe" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
      </div>

      <!-- Episode Selection Grid -->
      <div style="margin-top: 12px; padding: 8px; background: rgba(0,0,0,0.03); border: 1px solid #ccc;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <strong style="font-size: 12px;">SELECT EPISODE</strong>
          <span id="episodeCountBadge" style="font-size: 11px;"></span>
        </div>
        <div id="episodeGrid" style="display: flex; flex-wrap: wrap; gap: 4px; max-height: 160px; overflow-y: auto; background: #fff; padding: 6px; border: 1px solid #ddd;"></div>
      </div>

      <div class="row" style="justify-content: flex-end; margin-top: 10px;">
        <button type="button" onclick="closePlayer()">Close Player</button>
      </div>
    </div>
  </div>
</main>
</div>
<footer>
  <p>Streaming powered by MegaPlay. Licence problem or takedown request: contact details coming soon.</p>
</footer>
</div>

<script>
    let currentAnimeId = null;
    let currentAnimeTitle = '';
    let currentEp = 1;
    let totalEpisodes = 12;
    let currentType = 'sub';
    const recommendedIds = [174154, 145064, 40748, 1735, 269, 21, 101922, 11061, 16498];

    async function loadRecommended() {
        const grid = document.getElementById('alist');
        if(!grid) return;
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;">Loading recommended hits...</div>';

        const graphqlQuery = `
            query ($idIn: [Int]) {
                Page (perPage: 12) {
                    media (id_in: $idIn, type: ANIME, sort: POPULARITY_DESC) {
                        id
                        title { romaji english }
                        coverImage { large }
                        episodes
                    }
                }
            }
        `;

        try {
            const response = await fetch('https://graphql.anilist.co', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: graphqlQuery, variables: { idIn: recommendedIds } })
            });
            const data = await response.json();
            renderCards(data.data.Page.media, grid);
        } catch (err) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;">Type an anime name above to begin.</div>';
        }
    }

    async function handleSearch(event) {
        event.preventDefault();
        const query = document.getElementById('aq').value.trim();
        if (!query) { loadRecommended(); return; }

        const grid = document.getElementById('alist');
        grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;">Searching database...</div>';

        const graphqlQuery = `
            query ($search: String) {
                Page (perPage: 20) {
                    media (search: $search, type: ANIME) {
                        id
                        title { romaji english }
                        coverImage { large }
                        episodes
                    }
                }
            }
        `;

        try {
            const response = await fetch('https://graphql.anilist.co', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: graphqlQuery, variables: { search: query } })
            });
            const data = await response.json();
            const animeList = data.data.Page.media;
            
            if (animeList.length === 0) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;">No anime found.</div>';
                return;
            }
            renderCards(animeList, grid);
        } catch (err) {
            grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:20px;">Failed to fetch results.</div>';
        }
    }

    function renderCards(animeList, grid) {
        grid.innerHTML = '';
        animeList.forEach(anime => {
            const title = anime.title.english || anime.title.romaji;
            const eps = anime.episodes || '?';
            const card = document.createElement('div');
            card.style.cssText = 'border:1px solid #ccc; background:#fff; padding:8px; display:flex; flex-direction:column; justify-content:space-between; cursor:pointer;';
            card.onclick = () => selectAnime(anime.id, title, anime.episodes);

            card.innerHTML = `
                <img src="${anime.coverImage.large}" alt="${title}" style="width:100%; aspect-ratio:3/4; object-fit:cover; border:1px solid #ddd; margin-bottom:6px;">
                <div>
                    <h3 style="font-size:13px; margin:2px 0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${title}</h3>
                    <span style="font-size:11px; color:#666;">${eps} Episodes</span>
                </div>
                <button type="button" style="margin-top:6px; width:100%; font-size:11px; padding:3px;">WATCH</button>
            `;
            grid.appendChild(card);
        });
    }

    function selectAnime(id, title, eps, startEp = 1) {
        currentAnimeId = id;
        currentAnimeTitle = title;
        totalEpisodes = eps || 12;

        document.getElementById('browser-win').style.display = 'none';
        document.getElementById('player-win').removeAttribute('hidden');
        document.getElementById('player-title').innerText = title;
        document.getElementById('episodeCountBadge').innerText = `${totalEpisodes} EPS`;

        buildEpisodeList();
        playEpisode(startEp);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buildEpisodeList() {
        const episodeGrid = document.getElementById('episodeGrid');
        episodeGrid.innerHTML = '';
        const limit = Math.min(totalEpisodes, 1500);

        for (let i = 1; i <= limit; i++) {
            const btn = document.createElement('button');
            btn.id = `ep-btn-${i}`;
            btn.innerText = `EP ${i}`;
            btn.style.cssText = 'font-size:11px; padding:2px 6px; cursor:pointer;';
            btn.onclick = () => playEpisode(i);
            episodeGrid.appendChild(btn);
        }
    }

    function setSource(type, btnEl) {
        currentType = type;
        document.querySelectorAll('.provider-btn').forEach(b => b.classList.remove('active', 'btn-active'));
        btnEl.classList.add('active');
        playEpisode(currentEp);
    }

    function playEpisode(epNum) {
        currentEp = epNum;
        document.querySelectorAll('#episodeGrid button').forEach(b => {
            b.style.background = '';
            b.style.color = '';
        });

        const activeBtn = document.getElementById(`ep-btn-${epNum}`);
        if(activeBtn) {
            activeBtn.style.background = '#203b14';
            activeBtn.style.color = '#fff';
        }

        // MegaPlay Embed Endpoint
        const embedUrl = `https://megaplay.buzz/stream/ani/${currentAnimeId}/${epNum}/${currentType}`;
        document.getElementById('mp-iframe').src = embedUrl;
    }

    function closePlayer() {
        document.getElementById('player-win').setAttribute('hidden', '');
        document.getElementById('browser-win').style.display = 'block';
        document.getElementById('mp-iframe').src = '';
    }

    // Load recommendations on initial load
    loadRecommended();
</script>
</body>
</html>
