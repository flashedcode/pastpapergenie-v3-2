name: Update game list
on:
  push:
    branches: [main]
    paths: ['resources/**', '.github/build-games.js']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node .github/build-games.js
      - name: Commit games.json if it changed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add games.json
          git diff --cached --quiet || (git commit -m "Update game list" && git push)
