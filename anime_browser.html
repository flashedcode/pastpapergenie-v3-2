<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anime browser | pastpapergenie</title>
<meta name="description" content="Search anime and stream via MegaPlay.">
<link rel="stylesheet" href="../style.css">
<style>
  /* Modal Overlay for MegaPlay */
  #megaplay-modal {
    display: none;
    position: fixed;
    top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 9999;
    justify-content: center;
    align-items: center;
  }
  #megaplay-container {
    position: relative;
    width: 90%;
    max-width: 900px;
    background: #111;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 10px 25px rgba(0,0,0,0.5);
  }
  #megaplay-container iframe {
    width: 100%;
    height: 500px;
    border: none;
    display: block;
  }
  .close-modal {
    position: absolute;
    top: 8px; right: 12px;
    background: #ff4d4d;
    color: white;
    border: none;
    padding: 6px 12px;
    font-weight: bold;
    cursor: pointer;
    border-radius: 4px;
    z-index: 10000;
  }
</style>
</head>
<body>
<div id="page">
<header>
<p class="logo"><a href="../#/games">pastpapergenie <small>v3</small></a></p>
<p class="blurb">Browser games and an anime browser.</p>
</header>
<nav>
<a href="../#/games">Games</a>
<a class="start" href="./">Anime</a>
<a href="../#/recommended">Recommended</a>
<a href="../#/saved">Saved</a>
<a href="../#/settings">Settings</a>
<a href="../#/about">About</a>
</nav>
<div id="cols">
<main>
<div class="win"><h2>Anime</h2><div class="in">
<form id="abar" class="row">
  <input id="aq" type="search" placeholder="Search a title, e.g. Naruto" aria-label="Search our 26,000+ anime" style="flex:1"> 
  <button class="go" type="submit">Search</button>
</form>
<div id="alist" class="grid"></div>
<div id="detail" hidden></div>
<p class="small">Thanks!</p>
</div></div>
</main>
</div>

<!-- MegaPlay Modal -->
<div id="megaplay-modal">
  <div id="megaplay-container">
    <button class="close-modal" onclick="closePlayer()">Close ✕</button>
    <iframe id="mp-iframe" src="" allowfullscreen></iframe>
  </div>
</div>

<footer><p>Contact details coming soon.</p></footer>
</div>

<!-- Core script logic -->
<script src="script.js"></script>
</body>
</html>
